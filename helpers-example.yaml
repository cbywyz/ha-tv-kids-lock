# 电视家长管控 —— 辅助元素定义（helpers）
# 整段加入 configuration.yaml 后重启 HA，或按名字用 UI 逐个创建。
# 注意：timer 实体前端自带每秒倒计时显示，直接放上卡片即可。

input_boolean:
  tv_source_lock:
    name: 电视信号源锁定
    icon: mdi:television-classic-lock
  dian_shi_yin_liang_suo_ding:
    name: 电视音量锁定
    icon: mdi:volume-high
  # 内部标记：本次锁定是倒计时自动上的锁（手动开的锁不标记，永不被定时解锁）
  ben_ci_wei_dao_ji_shi_suo_ding:
    name: 本次为倒计时锁定

input_select:
  tv_lock_source:
    name: 电视锁定信号源
    icon: mdi:import
    # 按你自己电视 media_player 的 source_list 属性填写
    options:
      - TV
      - DTMB
      - AV
      - HDMI 1
      - HDMI 2

input_number:
  # 给孩子填的数：填几就倒计时几分钟，填 0 取消
  er_tong_guan_kan_shi_chang:
    name: 儿童观看时长（分钟）
    min: 0
    max: 300
    step: 1
    icon: mdi:timer-outline
  # 上锁后再锁多久自动解，填 0 = 一直锁到家长手动解
  suo_ding_shi_chang:
    name: 自动解除锁定时长（分钟）
    min: 0
    max: 300
    step: 1
    icon: mdi:timer-lock-outline
  # 音量锁定时 = 音量上限；平时 = 面板音量滑条
  dian_shi_yin_liang:
    name: 电视音量
    min: 0
    max: 100
    step: 1
    icon: mdi:volume-high

timer:
  pin_dao_suo_ding_dao_ji_shi:
    name: 频道锁定倒计时
    icon: mdi:timer-sand
    restore: true
  pin_dao_suo_ding_jie_chu:
    name: 频道锁定解除倒计时
    icon: mdi:timer-lock
    restore: true

# ────────── 进阶篇：每日配额 / 模式 / 续杯（2026-09-28 新增）──────────
# 可以直接追加到上面的同名段落里，或单独建。

input_number:
  # 每天最多看多少分钟，0 = 不限制
  mei_ri_guan_kan_pei_e:
    name: 每日观看配额（分钟）
    min: 0
    max: 300
    step: 5
    icon: mdi:clock-alert-outline
  # 系统自动累加，别手动改
  jin_ri_yi_guan_kan:
    name: 今日已观看（分钟）
    min: 0
    max: 1440
    step: 1
    icon: mdi:progress-clock
  # 本周累计，周一发完周报后清零
  ben_zhou_lei_ji_guan_kan:
    name: 本周累计观看（分钟）
    min: 0
    max: 10080
    step: 1
    icon: mdi:calendar-clock

input_boolean:
  # 配额用尽标记，防止同一天重复上锁/重复推送
  jin_ri_pei_e_yi_yong_jin:
    name: 今日配额已用尽
    icon: mdi:lock-alert

input_select:
  dian_shi_mo_shi:
    name: 电视模式
    icon: mdi:television-classic
    options:
      - 常规
      - 作业模式
      - 睡眠模式
      - 今晚自由

counter:
  # 每天最多续杯几次，脚本里判断上限
  jin_ri_xu_bei_ci_shu:
    name: 今日续杯次数
    initial: 0
    step: 1
    icon: mdi:cup

timer:
  xu_bei_dao_ji_shi:
    name: 续杯倒计时
    icon: mdi:cup-outline
    restore: true
