# 小米电视家长管控 —— 辅助元素定义（helpers）
# 整段加入 configuration.yaml 后重启 HA，或按名字用 UI 逐个创建。
# 注意：timer 实体前端自带每秒倒计时显示，直接放上卡片即可。

input_boolean:
  tv_source_lock:
    name: 电视信号源锁定
    icon: mdi:television-classic-lock
  dian_shi_yin_liang_suo_ding:
    name: 电视音量锁定
    icon: mdi:volume-high
  # 内部标记：本次锁定是倒计时自动上的锁（手动开的锁不标记，永不被定时解锁）
  ben_ci_wei_dao_ji_shi_suo_ding:
    name: 本次为倒计时锁定

input_select:
  tv_lock_source:
    name: 电视锁定信号源
    icon: mdi:import
    # 按你自己电视 media_player 的 source_list 属性填写
    options:
      - TV
      - DTMB
      - AV
      - HDMI 1
      - HDMI 2

input_number:
  # 给孩子填的数：填几就倒计时几分钟，填 0 取消
  er_tong_guan_kan_shi_chang:
    name: 儿童观看时长（分钟）
    min: 0
    max: 300
    step: 1
    icon: mdi:timer-outline
  # 上锁后再锁多久自动解，填 0 = 一直锁到家长手动解
  suo_ding_shi_chang:
    name: 自动解除锁定时长（分钟）
    min: 0
    max: 300
    step: 1
    icon: mdi:timer-lock-outline
  # 音量锁定时 = 音量上限；平时 = 面板音量滑条
  dian_shi_yin_liang:
    name: 电视音量
    min: 0
    max: 100
    step: 1
    icon: mdi:volume-high

timer:
  pin_dao_suo_ding_dao_ji_shi:
    name: 频道锁定倒计时
    icon: mdi:timer-sand
    restore: true
  pin_dao_suo_ding_jie_chu:
    name: 频道锁定解除倒计时
    icon: mdi:timer-lock
    restore: true
