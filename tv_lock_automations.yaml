# 小米电视家长管控 —— 完整自动化合集（可整体粘贴进 automations.yaml）
# 配套教程见 README.md。使用前请把 media_player.living_room_tv / media_player.android_tv
# 替换为你自己的电视实体 ID；helper 定义见 helpers-example.yaml。

# ── 音量：面板滑条下发（停手 2 秒防刷屏）────────────────────────
- id: tv_apply_volume
  alias: "[电视] 应用自定义音量"
  description: 面板改「电视音量」数值 → 停手 2 秒后自动下发到电视
  mode: single
  trigger:
    - platform: state
      entity_id: input_number.dian_shi_yin_liang
      for: "00:00:02"
  action:
    - service: media_player.volume_set
      target:
        entity_id: media_player.living_room_tv
      data:
        volume_level: "{{ states('input_number.dian_shi_yin_liang') | float(0) / 100 }}"
      continue_on_error: true
    # Android TV 辅助通道（没接就删掉这一段）
    - service: media_player.volume_set
      target:
        entity_id: media_player.android_tv
      data:
        volume_level: "{{ states('input_number.dian_shi_yin_liang') | float(0) / 100 }}"
      continue_on_error: true

# ── 音量：上限锁（超了拉回，0.5% 死区防自触发）──────────────────
- id: tv_volume_lock
  alias: "[电视] 音量锁定（上限模式，超了拉回）"
  description: >-
    打开「电视音量锁定」后，「电视音量」里填的数值就是音量上限：
    可以随便调小，但只要超过上限就自动拉回到上限值。
    只认 0.5% 以上的超限，避免自己拉回时反复触发。
  mode: single
  trigger:
    - platform: state
      entity_id: media_player.living_room_tv
      attribute: volume_level
  condition:
    - condition: state
      entity_id: input_boolean.dian_shi_yin_liang_suo_ding
      state: "on"
    - condition: template
      value_template: >-
        {% set target = states('input_number.dian_shi_yin_liang') | float(0) / 100 %}
        {% set cur = state_attr(trigger.entity_id, 'volume_level') %}
        {{ cur is not none and cur - target > 0.005 }}
  action:
    - service: media_player.volume_set
      target:
        entity_id: "{{ trigger.entity_id }}"
      data:
        volume_level: "{{ states('input_number.dian_shi_yin_liang') | float(0) / 100 }}"

# ── 信号源：锁定生效立即强切（不信任 source 缓存，连发两次防云丢指令）──
- id: tv_lock_engage_switch
  alias: "[电视] 锁定生效立即强切信号源"
  description: 锁定开关打开且电视开着 → 立刻切到锁定源，5 秒后补发一次。
  mode: single
  trigger:
    - platform: state
      entity_id: input_boolean.tv_source_lock
      to: "on"
  condition:
    - condition: state
      entity_id: media_player.living_room_tv
      state: "on"
  action:
    - service: media_player.select_source
      target:
        entity_id: media_player.living_room_tv
      data:
        source: "{{ states('input_select.tv_lock_source') }}"
    - delay: "00:00:05"
    - service: media_player.select_source
      target:
        entity_id: media_player.living_room_tv
      data:
        source: "{{ states('input_select.tv_lock_source') }}"

# ── 信号源：换台拦截 + 每分钟兜底 ───────────────────────────────
- id: tv_source_lock
  alias: "[电视] 信号源锁定"
  description: 锁定开启时信号源被切走自动切回；云指令偶发限流，每分钟兜底重发直到切回。
  mode: single
  max_exceeded: silent
  trigger:
    - platform: state
      entity_id: input_boolean.tv_source_lock
      to: "on"
    - platform: state
      entity_id: media_player.living_room_tv
    - platform: time_pattern
      minutes: "/1"
  condition:
    - condition: state
      entity_id: input_boolean.tv_source_lock
      state: "on"
    - condition: template
      value_template: >-
        {% set want = states('input_select.tv_lock_source') %}
        {% set cur = state_attr('media_player.living_room_tv','source') %}
        {{ states('media_player.living_room_tv') == 'on'
           and (cur is none or cur != want) }}
  action:
    - service: media_player.select_source
      target:
        entity_id: media_player.living_room_tv
      data:
        source: "{{ states('input_select.tv_lock_source') }}"

# ── 儿童定时锁：启动 / 取消 ─────────────────────────────────────
- id: tv_lock_countdown_start
  alias: "[电视] 频道锁定倒计时启动"
  description: 填「儿童观看时长（分钟）」即启动倒计时；改数字重新计时，填 0 取消。
  mode: restart
  trigger:
    - platform: state
      entity_id: input_number.er_tong_guan_kan_shi_chang
  condition:
    - condition: template
      value_template: "{{ states('input_number.er_tong_guan_kan_shi_chang') | int(0) > 0 }}"
  action:
    - service: timer.start
      target:
        entity_id: timer.pin_dao_suo_ding_dao_ji_shi
      data:
        duration: >-
          {% set m = states('input_number.er_tong_guan_kan_shi_chang') | int(0) %}
          {{ '{:02d}:{:02d}:00'.format(m // 60, m % 60) }}

- id: tv_lock_countdown_cancel
  alias: "[电视] 取消频道锁定倒计时"
  description: 时长调到 0 立刻取消倒计时。
  mode: single
  trigger:
    - platform: numeric_state
      entity_id: input_number.er_tong_guan_kan_shi_chang
      below: 1
  action:
    - service: timer.cancel
      target:
        entity_id: timer.pin_dao_suo_ding_dao_ji_shi

# ── 儿童定时锁：到点自动上锁（并按需启动解除倒计时）──────────────
- id: tv_lock_countdown_finish
  alias: "[电视] 倒计时到点自动锁频道"
  description: 倒计时结束 → 打开信号源锁定；若「自动解除锁定时长」>0 则同时启动解除倒计时。
  mode: single
  trigger:
    - platform: event
      event_type: timer.finished
      event_data:
        entity_id: timer.pin_dao_suo_ding_dao_ji_shi
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.tv_source_lock
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.ben_ci_wei_dao_ji_shi_suo_ding
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ states('input_number.suo_ding_shi_chang') | int(0) > 0 }}"
          sequence:
            - service: timer.start
              target:
                entity_id: timer.pin_dao_suo_ding_jie_chu
              data:
                duration: >-
                  {% set m = states('input_number.suo_ding_shi_chang') | int(0) %}
                  {{ '{:02d}:{:02d}:00'.format(m // 60, m % 60) }}

# ── 儿童定时锁：到点自动解锁 / 手动解锁清理 ─────────────────────
- id: tv_lock_release_finish
  alias: "[电视] 定时锁定到点自动解除"
  description: 解除倒计时结束，且本次确实是倒计时锁的 → 自动解锁（手动锁不受影响）。
  mode: single
  trigger:
    - platform: event
      event_type: timer.finished
      event_data:
        entity_id: timer.pin_dao_suo_ding_jie_chu
  condition:
    - condition: state
      entity_id: input_boolean.ben_ci_wei_dao_ji_shi_suo_ding
      state: "on"
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.tv_source_lock
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.ben_ci_wei_dao_ji_shi_suo_ding

- id: tv_lock_unlock_cleanup
  alias: "[电视] 手动解锁时清理定时标记"
  description: 锁定被关掉（手动解锁）→ 清标记 + 取消解除倒计时，防止到点误解锁。
  mode: single
  trigger:
    - platform: state
      entity_id: input_boolean.tv_source_lock
      to: "off"
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.ben_ci_wei_dao_ji_shi_suo_ding
    - service: timer.cancel
      target:
        entity_id: timer.pin_dao_suo_ding_jie_chu


# ============================================================
# 进阶篇：每日配额 / 分时段模式 / 续杯 / 周报（2026-09-28 新增）
# 依赖 helpers-example.yaml 里的进阶辅助元素，详见 README 第八、九章。
# ============================================================

# ── 每日配额：电视开机每分钟累加今日已看 ──
- id: tv_watch_minutes_acc
  alias: "[电视] 今日观看分钟累计"
  description: 电视处于开机状态时每分钟累加「今日已观看」，供每日配额判断使用。
  mode: single
  trigger:
    - platform: time_pattern
      minutes: "/1"
  condition:
    - condition: state
      entity_id: media_player.living_room_tv
      state: "on"
  action:
    - service: input_number.set_value
      target:
        entity_id: input_number.jin_ri_yi_guan_kan
      data:
        value: "{{ (states('input_number.jin_ri_yi_guan_kan') | float(0) + 1) | round(0) }}"

# ── ①-2 配额用尽 → 上锁 + 飞书通知（每天只通知一次）────────────

# ── 每日配额用尽 → 自动上锁 + 飞书通知 ──
- id: tv_quota_enforce
  alias: "[电视] 每日配额用尽自动锁定"
  description: 今日已观看 ≥ 每日配额 → 立即锁定信号源并推飞书；0 点自动重置。今晚自由模式豁免。
  mode: single
  trigger:
    - platform: state
      entity_id: input_number.jin_ri_yi_guan_kan
    - platform: state
      entity_id: input_number.mei_ri_guan_kan_pei_e
  condition:
    - condition: template
      value_template: >-
        {% set used = states('input_number.jin_ri_yi_guan_kan') | float(0) %}
        {% set quota = states('input_number.mei_ri_guan_kan_pei_e') | float(0) %}
        {{ quota > 0 and used >= quota }}
    - condition: template
      value_template: "{{ states('input_select.dian_shi_mo_shi') != '今晚自由' }}"
    - condition: state
      entity_id: input_boolean.jin_ri_pei_e_yi_yong_jin
      state: "off"
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.jin_ri_pei_e_yi_yong_jin
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.tv_source_lock
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.feishu_notify_master
              state: "on"
          sequence:
            - service: cn_im_hub.send_message
              data:
                channel: feishu/chat_id
                target: <你的飞书群ID>
                message: >-
                  📺 今日电视配额用尽
                  已看 {{ states('input_number.jin_ri_yi_guan_kan') | int }} 分钟 / 配额 {{ states('input_number.mei_ri_guan_kan_pei_e') | int }} 分钟
                  已自动锁定信号源，明天 0 点重置。

# ── ①-3 每日 0:01 重置 ─────────────────────────────────────────

# ── 每日 0:01 清零今日已看，并入本周累计 ──
- id: tv_daily_reset
  alias: "[电视] 每日零点重置观看统计"
  description: 今日分钟并入本周累计 → 今日清零 → 配额用尽标记与续杯次数重置。
  mode: single
  trigger:
    - platform: time
      at: "00:01:00"
  action:
    - service: input_number.set_value
      target:
        entity_id: input_number.ben_zhou_lei_ji_guan_kan
      data:
        value: "{{ (states('input_number.ben_zhou_lei_ji_guan_kan') | float(0) + states('input_number.jin_ri_yi_guan_kan') | float(0)) | round(0) }}"
    - service: input_number.set_value
      target:
        entity_id: input_number.jin_ri_yi_guan_kan
      data:
        value: 0
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.jin_ri_pei_e_yi_yong_jin
    - service: counter.reset
      target:
        entity_id: counter.jin_ri_xu_bei_ci_shu

# ── ①-4 周一 09:00 飞书周报 ────────────────────────────────────

# ── 每周一推送本周观看时长周报 ──
- id: tv_weekly_report
  alias: "[电视] 每周一推送观看时长周报"
  description: 周一早 9 点把本周累计观看分钟数推到飞书，随后清零。
  mode: single
  trigger:
    - platform: time
      at: "09:00:00"
  condition:
    - condition: time
      weekday:
        - mon
    - condition: state
      entity_id: input_boolean.feishu_notify_master
      state: "on"
  action:
    - service: cn_im_hub.send_message
      data:
        channel: feishu/chat_id
        target: <你的飞书群ID>
        message: >-
          📊 电视观看周报
          本周累计 {{ states('input_number.ben_zhou_lei_ji_guan_kan') | int }} 分钟（日均 {{ (states('input_number.ben_zhou_lei_ji_guan_kan') | float(0) / 7) | round(0) }} 分钟）
          今日已看 {{ states('input_number.jin_ri_yi_guan_kan') | int }} 分钟
          统计已清零，新的一周开始。
    - service: input_number.set_value
      target:
        entity_id: input_number.ben_zhou_lei_ji_guan_kan
      data:
        value: 0

# ── ②-1 睡眠模式：开机即关 ─────────────────────────────────────

# ── 睡眠模式下开机自动关闭 ──
- id: tv_sleep_enforce
  alias: "[电视] 睡眠模式下开机自动关闭"
  description: 睡眠模式期间电视一旦被打开立即关掉并推飞书（防孩子夜里偷看）。
  mode: single
  trigger:
    - platform: state
      entity_id: media_player.living_room_tv
      to: "on"
  condition:
    - condition: state
      entity_id: input_select.dian_shi_mo_shi
      state: "睡眠模式"
  action:
    - service: media_player.turn_off
      target:
        entity_id: media_player.living_room_tv
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.feishu_notify_master
              state: "on"
          sequence:
            - service: cn_im_hub.send_message
              data:
                channel: feishu/chat_id
                target: <你的飞书群ID>
                message: "🌙 睡眠模式期间电视被打开，已自动关闭（{{ now().strftime('%H:%M') }}）"

# ── ②-2 每晚 22:30 自动进入睡眠模式 ────────────────────────────

# ── 每晚 22:30 自动进入睡眠模式 ──
- id: tv_mode_night_auto
  alias: "[电视] 每晚 22:30 进入睡眠模式"
  description: 每晚 22:30 切到睡眠模式（今晚自由模式不打扰）。
  mode: single
  trigger:
    - platform: time
      at: "22:30:00"
  condition:
    - condition: template
      value_template: "{{ states('input_select.dian_shi_mo_shi') != '今晚自由' }}"
  action:
    - service: input_select.select_option
      target:
        entity_id: input_select.dian_shi_mo_shi
      data:
        option: "睡眠模式"

# ── ②-3 早晨 07:00 自动恢复常规 ────────────────────────────────

# ── 早晨 7:00 自动恢复常规模式 ──
- id: tv_mode_morning_auto
  alias: "[电视] 早晨七点恢复常规模式"
  description: 早 7 点把睡眠模式切回常规。
  mode: single
  trigger:
    - platform: time
      at: "07:00:00"
  condition:
    - condition: state
      entity_id: input_select.dian_shi_mo_shi
      state: "睡眠模式"
  action:
    - service: input_select.select_option
      target:
        entity_id: input_select.dian_shi_mo_shi
      data:
        option: "常规"

# ── ②-4 作业模式：强制上锁且禁止解锁 ───────────────────────────

# ── 作业模式期间禁止解锁（解开 3 秒内锁回） ──
- id: tv_homework_mode_relock
  alias: "[电视] 作业模式期间禁止解锁"
  description: 切到作业模式立刻上锁；期间锁定一旦被关掉（手动/定时器）立刻重新上锁。
  mode: single
  trigger:
    - platform: state
      entity_id: input_select.dian_shi_mo_shi
      to: "作业模式"
    - platform: state
      entity_id: input_boolean.tv_source_lock
      to: "off"
  condition:
    - condition: state
      entity_id: input_select.dian_shi_mo_shi
      state: "作业模式"
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.tv_source_lock
    - service: timer.cancel
      target:
        entity_id: timer.pin_dao_suo_ding_jie_chu
    - service: timer.cancel
      target:
        entity_id: timer.xu_bei_dao_ji_shi

# ── ②-5 今晚自由模式：解锁并停掉所有定时器 ─────────────────────

# ── 今晚自由模式：自动解锁并停掉所有倒计时 ──
- id: tv_free_mode_unlock
  alias: "[电视] 今晚自由模式自动解锁"
  description: 切到「今晚自由」时立即解除锁定并取消相关倒计时（家长手动放行专用）。
  mode: single
  trigger:
    - platform: state
      entity_id: input_select.dian_shi_mo_shi
      to: "今晚自由"
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.tv_source_lock
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.jin_ri_pei_e_yi_yong_jin
    - service: timer.cancel
      target:
        entity_id: timer.pin_dao_suo_ding_dao_ji_shi
    - service: timer.cancel
      target:
        entity_id: timer.pin_dao_suo_ding_jie_chu
    - service: timer.cancel
      target:
        entity_id: timer.xu_bei_dao_ji_shi

# ── ③ 续杯 5 分钟到点重新上锁 ──────────────────────────────────

# ── 续杯时间到 → 重新锁定 ──
- id: tv_xu_bei_finish
  alias: "[电视] 续杯时间到重新锁定"
  description: 「再看5分钟」倒计时结束 → 重新锁定信号源。
  mode: single
  trigger:
    - platform: event
      event_type: timer.finished
      event_data:
        entity_id: timer.xu_bei_dao_ji_shi
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.tv_source_lock
